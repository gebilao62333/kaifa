<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eu搭子 · 用户端业务闭环交互导图</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#070b16;--panel:#0d1424;--panel2:#131c33;--line:#22304f;--text:#e8eeff;--muted:#8ea3cc;--accent:#6d8cff}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 20% -10%,#152048 0%,#070b16 55%) fixed,var(--bg);color:var(--text);font:14px/1.6 "PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;overflow:hidden}
header.topbar{height:74px;display:flex;align-items:center;gap:20px;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(9,14,26,.86);backdrop-filter:blur(10px);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:12px;min-width:330px}
.logo{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.5px;background:linear-gradient(135deg,#6d8cff,#a06bff);box-shadow:0 6px 18px rgba(109,140,255,.35)}
.brand h1{font-size:15px;font-weight:700;letter-spacing:.2px}
.brand p{font-size:11.5px;color:var(--muted)}
.tabs{display:flex;gap:6px;background:var(--panel);padding:5px;border-radius:12px;border:1px solid var(--line)}
.tab{border:0;background:transparent;color:var(--muted);padding:7px 15px;border-radius:9px;cursor:pointer;font-size:13px;font-family:inherit;transition:.18s}
.tab:hover{color:var(--text)}
.tab.active{background:linear-gradient(135deg,#3f5bd6,#6d8cff);color:#fff;box-shadow:0 4px 14px rgba(79,110,220,.4)}
.searchbox{margin-left:auto;position:relative;display:flex;align-items:center;gap:8px}
.searchbox input{width:250px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:8px 12px;font-size:13px;font-family:inherit;outline:none;transition:.18s}
.searchbox input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(109,140,255,.16)}
#qcount{font-size:11.5px;color:var(--muted);min-width:60px}
main{height:calc(100% - 74px);position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;overflow:auto}
.view.active{display:block}
/* ---------- 总览 ---------- */
.ov-wrap{display:flex;height:100%}
.ov-canvas{flex:1;display:flex;align-items:center;justify-content:center;padding:8px}
#flywheel{width:100%;height:100%;max-height:100%}
.ov-side{width:340px;border-left:1px solid var(--line);background:rgba(13,20,36,.75);padding:18px;overflow:auto}
.ov-side h2{font-size:15px;margin-bottom:6px}
.ov-side h3{font-size:12px;color:var(--muted);margin:16px 0 8px;letter-spacing:1px;font-weight:600}
.ov-side p{font-size:12.5px;color:#b9c8e8}
.stage-item{display:flex;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;transition:.15s;border:1px solid transparent}
.stage-item:hover{background:var(--panel2);border-color:var(--line)}
.stage-item.on{background:rgba(109,140,255,.14);border-color:rgba(109,140,255,.5)}
.stage-item b{display:block;font-size:13px}
.stage-item span{font-size:11.5px;color:var(--muted)}
.stage-item .idx{width:22px;height:22px;flex:none;border-radius:7px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.legend i{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-style:normal}
.legend i em{width:10px;height:10px;border-radius:3px;display:inline-block}
/* ---------- 闭环详解 ---------- */
.loop-wrap{display:flex;height:100%}
.loop-list{width:262px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:12px;background:rgba(13,20,36,.6)}
.list-cat{font-size:11px;color:var(--muted);letter-spacing:1.5px;margin:12px 8px 7px;font-weight:600}
.list-cat:first-child{margin-top:4px}
.loop-item{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:11px;cursor:pointer;transition:.15s;border:1px solid transparent}
.loop-item:hover{background:var(--panel2)}
.loop-item.on{background:rgba(109,140,255,.13);border-color:rgba(109,140,255,.45)}
.loop-item .ic{width:30px;height:30px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--panel2)}
.loop-item b{display:block;font-size:12.8px;font-weight:600}
.loop-item span{font-size:11px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.loop-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:10px}
#ring{width:100%;height:100%;max-height:640px}
.ring-bar{position:absolute;top:14px;right:18px;display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:6px 13px;border-radius:9px;cursor:pointer;font-size:12.5px;font-family:inherit;transition:.15s}
.btn:hover{border-color:var(--accent);color:#fff}
.btn.on{background:linear-gradient(135deg,#3f5bd6,#6d8cff);border-color:transparent}
.loop-detail{width:430px;flex:none;border-left:1px solid var(--line);overflow:auto;padding:18px;background:rgba(13,20,36,.72)}
.d-head{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.d-head .d-icon{width:44px;height:44px;flex:none;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--panel2);border:1px solid var(--line)}
.d-head h2{font-size:16px}
.d-head p{font-size:12px;color:var(--muted)}
.d-cards{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:6px}
.d-card{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--c,#6d8cff);border-radius:10px;padding:9px 11px}
.d-card b{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.5px;display:block;margin-bottom:3px}
.d-card p{font-size:12.5px;color:#cfdcf8}
.d-title{font-size:11px;color:var(--muted);letter-spacing:1.4px;margin:16px 0 8px;font-weight:600}
.step-row{display:grid;grid-template-columns:22px 1fr;gap:9px;padding:8px 9px;border-radius:9px;cursor:pointer;transition:.15s;border:1px solid transparent}
.step-row:hover{background:var(--panel2)}
.step-row.hot{background:rgba(109,140,255,.16);border-color:rgba(109,140,255,.45)}
.step-row .sn{width:20px;height:20px;border-radius:6px;background:var(--panel2);font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--muted);margin-top:1px}
.step-row.hot .sn{background:var(--accent);color:#fff}
.step-row b{font-size:12.8px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.step-row b em{font-style:normal;font-size:10.5px;padding:1px 7px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
.step-row p{font-size:11.8px;color:#a9bbdd;margin-top:2px}
.step-row code{font-size:11px;color:#7fd1a8;background:rgba(127,209,168,.08);padding:0 5px;border-radius:4px;margin-right:5px}
.step-row i{font-size:11px;color:#f5a524;font-style:normal;display:block;margin-top:3px}
.breaks{list-style:none;display:grid;gap:6px}
.breaks li{font-size:12px;color:#ffc9c9;background:rgba(255,99,99,.09);border:1px solid rgba(255,99,99,.25);border-radius:9px;padding:7px 10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--panel2);color:#cfdcf8;font-size:11.5px;padding:5px 11px;border-radius:20px;cursor:pointer;font-family:inherit;transition:.15s}
.chip:hover{border-color:var(--accent);color:#fff}
.chip.up{border-color:rgba(34,197,94,.4);color:#9ae6b4}
.chip.down{border-color:rgba(245,165,36,.4);color:#fbd38d}
/* ---------- 功能全景 ---------- */
.tree-wrap{max-width:1080px;margin:0 auto;padding:20px 26px 60px}
.tnode{margin:1px 0}
.trow{display:flex;gap:8px;align-items:flex-start;padding:4px 9px;border-radius:8px;cursor:pointer;transition:.12s}
.trow:hover{background:var(--panel2)}
.tcaret{width:12px;color:var(--muted);font-size:11px;flex:none;text-align:center;line-height:22px}
.tlabel{font-size:13px}
.lv0 .tlabel{font-size:15px;font-weight:700}
.lv1 .tlabel{font-size:13.5px;font-weight:600;color:#cfe0ff}
.lv2 .tlabel{font-size:12.8px;color:#a9bbdd}
.tkids{margin-left:16px;border-left:1px dashed #1e2b46;padding-left:8px}
.tkids.hidden{display:none}
mark{background:rgba(245,165,36,.3);color:#ffe1a8;border-radius:3px;padding:0 2px}
.tree-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.tree-top h2{font-size:16px}
.tree-top .hint{font-size:11.5px;color:var(--muted)}
/* ---------- 页面索引 ---------- */
.pages-wrap{max-width:1080px;margin:0 auto;padding:20px 26px 60px}
table{width:100%;border-collapse:collapse;font-size:12.8px}
thead th{position:sticky;top:0;background:#0b1222;text-align:left;font-size:11px;letter-spacing:1px;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);z-index:2}
tbody td{padding:8px 12px;border-bottom:1px solid #16203a;vertical-align:top}
tbody tr:hover{background:var(--panel2)}
td.route{font-family:ui-monospace,Consolas,monospace;color:#9ecbff;white-space:nowrap}
td.svc{color:#7fd1a8;font-size:12px}
.pg-group{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:1px;padding:16px 12px 7px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#1e2b46;border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:#2c3d61}
::-webkit-scrollbar-track{background:transparent}
svg text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;user-select:none}
.node{cursor:pointer}
.flow{stroke-dasharray:5 7;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.hot{filter:drop-shadow(0 0 10px rgba(109,140,255,.9))}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">eu</div>
    <div>
      <h1>用户端 App 业务闭环交互导图</h1>
      <p>点节点看细节 · 沿箭头看闭环 · 数据取自 frontend 源码</p>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="overview">业务总览</button>
    <button class="tab" data-view="loop">闭环详解</button>
    <button class="tab" data-view="tree">功能全景</button>
    <button class="tab" data-view="pages">页面索引</button>
  </nav>
  <div class="searchbox">
    <input id="q" placeholder="搜索功能 / 页面 / 接口，回车定位">
    <span id="qcount"></span>
  </div>
</header>
<main>
  <section id="v-overview" class="view active">
    <div class="ov-wrap">
      <div class="ov-canvas"><svg id="flywheel" viewBox="0 0 1180 800" preserveAspectRatio="xMidYMid meet"></svg></div>
      <aside class="ov-side" id="ovSide"></aside>
    </div>
  </section>
  <section id="v-loop" class="view">
    <div class="loop-wrap">
      <div class="loop-list" id="loopList"></div>
      <div class="loop-stage">
        <div class="ring-bar">
          <button class="btn" id="playBtn">▶ 播放闭环</button>
          <button class="btn" id="resetBtn">重置</button>
        </div>
        <svg id="ring" viewBox="0 0 780 680" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="loop-detail" id="loopDetail"></div>
    </div>
  </section>
  <section id="v-tree" class="view">
    <div class="tree-wrap">
      <div class="tree-top"><h2>功能全景</h2><span class="hint" id="treeHint"></span></div>
      <div id="tree"></div>
    </div>
  </section>
  <section id="v-pages" class="view">
    <div class="pages-wrap">
      <div class="tree-top"><h2>页面 / 路由索引</h2><span class="hint" id="pagesHint"></span></div>
      <table><thead><tr><th style="width:230px">路由</th><th style="width:190px">页面</th><th>主要服务 / 说明</th></tr></thead><tbody id="pagesBody"></tbody></table>
    </div>
  </section>
</main>

<script>
(function(){
var DATA = JSON.parse(document.getElementById('appdata').textContent);
var NS = 'http://www.w3.org/2000/svg';
var ACOL = DATA.actorColors;
var state = { view:'overview', loop:'order', step:-1, playing:false, q:'' };
var timer = null;

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function mk(tag, attrs, parent){
  var n = document.createElementNS(NS, tag);
  if (attrs) { for (var k in attrs) { n.setAttribute(k, attrs[k]); } }
  if (parent) { parent.appendChild(n); }
  return n;
}
function label(parent, x, y, str, o){
  o = o || {};
  var t = mk('text', { x:x, y:y, 'text-anchor': o.anchor || 'middle', 'font-size': o.size || 12.5,
    fill: o.fill || '#cfdcf8', 'font-weight': o.weight || 400 }, parent);
  t.textContent = str;
  return t;
}
function polar(cx, cy, rx, ry, deg){
  var r = (deg - 90) * Math.PI / 180;
  return { x: cx + rx * Math.cos(r), y: cy + ry * Math.sin(r) };
}
function arcPath(cx, cy, rx, ry, a, b){
  var p1 = polar(cx, cy, rx, ry, a), p2 = polar(cx, cy, rx, ry, b);
  var large = (b - a) > 180 ? 1 : 0;
  return 'M ' + p1.x.toFixed(1) + ' ' + p1.y.toFixed(1) + ' A ' + rx + ' ' + ry + ' 0 ' + large + ' 1 ' + p2.x.toFixed(1) + ' ' + p2.y.toFixed(1);
}
function wrap2(str){
  var n = str.length;
  if (n <= 5) { return [str]; }
  var mid = Math.ceil(n / 2);
  return [str.slice(0, mid), str.slice(mid)];
}
function loopById(id){ for (var i=0;i<DATA.loops.length;i++){ if (DATA.loops[i].id === id) return DATA.loops[i]; } return null; }
function stepColor(actor){ return ACOL[actor] || '#7c9cff'; }

/* ---------------- 总览飞轮 ---------------- */
var stagePos = {};
function renderFlywheel(){
  var svg = document.getElementById('flywheel');
  svg.innerHTML = '';
  var defs = mk('defs', null, svg);
  [['ah','#3b5bdb'],['ahHot','#ffd166']].forEach(function(m){
    var mk2 = mk('marker', { id:m[0], markerWidth:9, markerHeight:9, refX:7, refY:3.2, orient:'auto' }, defs);
    mk('path', { d:'M0,0 L7,3.2 L0,6.4 z', fill:m[1] }, mk2);
  });
  var cx = 590, cy = 386, rx = 336, ry = 250;
  var n = DATA.stageDefs.length, gap = 360 / n;
  DATA.stageDefs.forEach(function(st, i){
    var a1 = i * gap + 16, a2 = (i + 1) * gap - 16;
    var p = mk('path', { d: arcPath(cx, cy, rx, ry, a1, a2), fill:'none', stroke:'#2b4a8f', 'stroke-width':2.5, 'marker-end':'url(#ah)' }, svg);
    p.setAttribute('class', 'flow');
  });
  mk('circle', { cx:cx, cy:cy, r:112, fill:'rgba(109,140,255,.07)', stroke:'#26355a', 'stroke-width':1.5 }, svg);
  mk('circle', { cx:cx, cy:cy, r:88, fill:'rgba(109,140,255,.09)', stroke:'#2f4374', 'stroke-width':1 }, svg);
  label(svg, cx, cy - 16, '平台核心飞轮', { size:17, weight:700, fill:'#ffffff' });
  label(svg, cx, cy + 8, '供给 → 曝光 → 转化', { size:12, fill:'#9fb3de' });
  label(svg, cx, cy + 28, '履约 → 结算 → 回流', { size:12, fill:'#9fb3de' });
  DATA.stageDefs.forEach(function(st, i){
    var deg = i * gap;
    var pt = polar(cx, cy, rx, ry, deg);
    stagePos[st.id] = pt;
    var g = mk('g', { 'class':'node' }, svg);
    var hot = state.stageId === st.id;
    mk('circle', { cx:pt.x, cy:pt.y, r:54, fill: hot ? 'rgba(109,140,255,.32)' : 'rgba(19,28,51,.95)',
      stroke: hot ? '#8ba4ff' : '#2b3c60', 'stroke-width': hot ? 3 : 1.6 }, g);
    label(g, pt.x, pt.y + 7, String(i + 1).padStart(2, '0'), { size:19, weight:700, fill: hot ? '#ffffff' : '#8ea3cc' });
    var lines = wrap2(st.name);
    var below = pt.y < cy;
    lines.forEach(function(ln, li){
      label(g, pt.x, pt.y + (below ? -70 - (lines.length - 1 - li) * 18 : 76 + li * 18), ln,
        { size:13.5, weight:600, fill: hot ? '#ffffff' : '#cfdcf8' });
    });
    var tm = mk('title', null, g); tm.textContent = st.name + '：' + st.desc;
    g.onclick = function(){ state.stageId = st.id; renderFlywheel(); renderOvSide(st); };
  });
  DATA.satellites.forEach(function(sa){
    var attach = stagePos[sa.attach];
    var loop = loopById(sa.id);
    var on = state.loop === sa.id;
    mk('path', { d:'M ' + sa.x + ' ' + sa.y + ' L ' + attach.x + ' ' + attach.y, stroke: on ? '#8ba4ff' : '#243352',
      'stroke-width': on ? 2 : 1.4, 'stroke-dasharray':'5 6', fill:'none' }, svg);
    var g = mk('g', { 'class':'node' }, svg);
    mk('rect', { x: sa.x - 74, y: sa.y - 22, width:148, height:44, rx:12,
      fill: on ? 'rgba(109,140,255,.22)' : 'rgba(19,28,51,.92)', stroke: on ? '#8ba4ff' : '#2b3c60', 'stroke-width': on ? 2 : 1.3 }, g);
    label(g, sa.x, sa.y + 5, sa.name, { size:12.5, weight:600, fill: on ? '#ffffff' : '#b9c8e8' });
    var tm = mk('title', null, g); tm.textContent = loop ? loop.tagline : '';
    g.onclick = function(){ showView('loop'); openLoop(sa.id); };
  });
}
function renderOvSide(st){
  var host = document.getElementById('ovSide');
  var h = '';
  if (st) {
    h += '<h2>' + esc(st.name) + '</h2><p>' + esc(st.desc) + '</p>';
    h += '<h3>涉及页面</h3><p style="color:#9ecbff">' + esc(st.pages) + '</p>';
    h += '<h3>该环节覆盖的闭环</h3><div class="chips">';
    st.loops.forEach(function(id){ var lp = loopById(id); if (lp) { h += '<button class="chip" data-loop="' + id + '">' + lp.icon + ' ' + esc(lp.name) + '</button>'; } });
    h += '</div>';
    h += '<h3>怎么读这张图</h3><p>外圈 8 个环节顺时针咬合就是平台主飞轮：供给被生产出来 → 内容与推荐让它被看见 → 用户发现并沟通 → 下单履约 → 评价沉淀信任 → 资金结算 → 收入回流到供给侧，飞轮重新转起来。四周虚线方块是支撑闭环，点开即进入详解。</p>';
  } else {
    h += '<h2>业务总览：一个飞轮 + 六个支撑闭环</h2>';
    h += '<p>把用户端所有功能串起来看，只有一条主线：<b>供给被生产 → 被看见 → 被匹配 → 被沟通转化 → 被履约 → 被评价 → 被结算 → 收入回流再生产</b>。任何一环断掉，闭环就停转。</p>';
    h += '<h3>主飞轮 8 环节</h3>';
    DATA.stageDefs.forEach(function(s, i){
      h += '<div class="stage-item" data-stage="' + s.id + '"><div class="idx">' + String(i + 1).padStart(2, '0') + '</div><div><b>' + esc(s.name) + '</b><span>' + esc(s.desc) + '</span></div></div>';
    });
    h += '<h3>角色图例</h3><div class="legend">';
    ['用户','陪玩师','平台','系统','第三方'].forEach(function(a){
      h += '<i><em style="background:' + (ACOL[a] || '#888') + '"></em>' + a + '</i>';
    });
    h += '</div>';
    h += '<h3>怎么读这张图</h3><p>点中间任一环节看它承接谁、交给谁；点四周虚线方块进入支撑闭环的分解动画；在「闭环详解」里可以逐帧播放每个闭环的完整链路与断点风险。</p>';
  }
  host.innerHTML = h;
}

/* ---------------- 闭环详解 ---------------- */
function renderLoopList(){
  var host = document.getElementById('loopList');
  var h = '';
  ['主线','支撑'].forEach(function(cat){
    var arr = DATA.loops.filter(function(l){ return l.cat === cat; });
    h += '<div class="list-cat">' + (cat === '主线' ? '主线闭环' : '支撑闭环') + ' · ' + arr.length + '</div>';
    arr.forEach(function(l){
      h += '<div class="loop-item' + (l.id === state.loop ? ' on' : '') + '" data-loop="' + l.id + '">' +
           '<div class="ic" style="background:' + l.color + '22;color:' + l.color + '">' + l.icon + '</div>' +
           '<div><b>' + esc(l.name) + '</b><span>' + esc(l.tagline) + '</span></div></div>';
    });
  });
  host.innerHTML = h;
}
function renderRing(loop, hot){
  var svg = document.getElementById('ring');
  svg.innerHTML = '';
  var defs = mk('defs', null, svg);
  [['ah','#3b5bdb'],['ahHot','#ffd166'],['ahBack','#22c55e']].forEach(function(m){
    var mk2 = mk('marker', { id:m[0], markerWidth:9, markerHeight:9, refX:7, refY:3.2, orient:'auto' }, defs);
    mk('path', { d:'M0,0 L7,3.2 L0,6.4 z', fill:m[1] }, mk2);
  });
  var cx = 390, cy = 330, R = 232, NR = 40;
  var n = loop.steps.length, gap = 360 / n;
  var d = (NR + 12) / R * (180 / Math.PI);
  for (var i = 0; i < n; i++) {
    var j = (i + 1) % n;
    var isBack = (j === 0);
    var a1 = i * gap + d, a2 = j * gap - d + (isBack ? 360 : 0);
    var hotEdge = state.playing && state.step === i;
    var stroke = isBack ? '#22c55e' : (hotEdge ? '#ffd166' : '#2b4a8f');
    var p = mk('path', { d: arcPath(cx, cy, R, R, a1, a2), fill:'none', stroke:stroke,
      'stroke-width': hotEdge || isBack ? 2.6 : 2, 'marker-end': 'url(#' + (isBack ? 'ahBack' : (hotEdge ? 'ahHot' : 'ah')) + ')' }, svg);
    if (hotEdge || isBack) { p.setAttribute('class', 'flow'); }
  }
  if (n > 1) {
    var mid = polar(cx, cy, R, R, (0 * gap + (n - 1) * gap) / 2 + gap / 2);
    label(svg, mid.x, mid.y, '闭环回流', { size:11.5, fill:'#4ade80' });
  }
  mk('circle', { cx:cx, cy:cy, r:74, fill:'rgba(109,140,255,.06)', stroke:'#26355a', 'stroke-width':1.2 }, svg);
  label(svg, cx, cy - 6, loop.name.replace('闭环',''), { size:14.5, weight:700, fill:'#ffffff' });
  label(svg, cx, cy + 16, loop.steps.length + ' 步 · ' + loop.cat, { size:11.5, fill:'#8ea3cc' });
  loop.steps.forEach(function(s, i){
    var deg = i * gap;
    var pt = polar(cx, cy, R, R, deg);
    var g = mk('g', { 'class':'node' }, svg);
    var col = stepColor(s.a);
    var on = state.step === i;
    mk('circle', { cx:pt.x, cy:pt.y, r:NR, fill: on ? col + '44' : 'rgba(19,28,51,.96)', stroke: on ? '#ffffff' : col, 'stroke-width': on ? 3 : 1.8 }, g);
    label(g, pt.x, pt.y + 6, String(i + 1), { size:17, weight:700, fill: on ? '#ffffff' : col });
    var dxs = pt.x - cx;
    var anchor = Math.abs(dxs) < 45 ? 'middle' : (dxs > 0 ? 'start' : 'end');
    var lx = pt.x + (Math.abs(dxs) < 45 ? 0 : (dxs > 0 ? NR + 14 : -(NR + 14)));
    var ly = pt.y + (Math.abs(dxs) < 45 ? (pt.y < cy ? -(NR + 16) : NR + 26) : 5);
    label(g, lx, ly, s.l, { size:12.5, weight:600, anchor:anchor, fill: on ? '#ffffff' : '#cfdcf8' });
    var tm = mk('title', null, g); tm.textContent = s.a + ' · ' + s.d;
    g.onclick = function(){ state.step = i; renderRing(loop, i); renderDetail(loop); };
  });
}
function renderDetail(loop){
  var host = document.getElementById('loopDetail');
  var h = '';
  h += '<div class="d-head"><div class="d-icon" style="color:' + loop.color + '">' + loop.icon + '</div><div><h2>' + esc(loop.name) + '</h2><p>' + esc(loop.tagline) + '</p></div></div>';
  h += '<div class="d-cards" style="--c:' + loop.color + '">';
  h += '<div class="d-card"><b>闭环目标</b><p>' + esc(loop.goal) + '</p></div>';
  h += '<div class="d-card"><b>触发条件</b><p>' + esc(loop.trigger) + '</p></div>';
  h += '<div class="d-card"><b>闭环产出</b><p>' + esc(loop.outcome) + '</p></div>';
  h += '</div>';
  h += '<h3 class="d-title">闭环步骤 · ' + loop.steps.length + ' 步</h3>';
  loop.steps.forEach(function(s, i){
    h += '<div class="step-row' + (state.step === i ? ' hot' : '') + '" data-step="' + i + '">' +
         '<div class="sn">' + (i + 1) + '</div><div>' +
         '<b>' + esc(s.l) + '<em style="color:' + stepColor(s.a) + ';border-color:' + stepColor(s.a) + '66">' + esc(s.a) + '</em></b>' +
         '<p>' + esc(s.d) + '</p>' +
         '<p style="margin-top:4px"><code>' + esc(s.p) + '</code><span style="font-size:11px;color:#7fd1a8">' + esc(s.s) + '</span></p>' +
         '<i>状态：' + esc(s.st) + '</i>' +
         '</div></div>';
  });
  h += '<h3 class="d-title">断点风险 · 闭环在哪里会断</h3><ul class="breaks">';
  loop.breaks.forEach(function(b){ h += '<li>' + esc(b) + '</li>'; });
  h += '</ul>';
  h += '<h3 class="d-title">上游闭环（谁给它输送）</h3><div class="chips">';
  (loop.up.length ? loop.up : ['无']).forEach(function(id){
    var lp = loopById(id);
    h += lp ? '<button class="chip up" data-loop="' + id + '">' + lp.icon + ' ' + esc(lp.name) + '</button>' : '<span class="chip">无</span>';
  });
  h += '</div><h3 class="d-title">下游闭环（它给谁输送）</h3><div class="chips">';
  (loop.down.length ? loop.down : ['无']).forEach(function(id){
    var lp = loopById(id);
    h += lp ? '<button class="chip down" data-loop="' + id + '">' + lp.icon + ' ' + esc(lp.name) + '</button>' : '<span class="chip">无</span>';
  });
  h += '</div>';
  host.innerHTML = h;
  var hot = host.querySelector('.step-row.hot');
  if (hot && state.playing && hot.scrollIntoView) { try { hot.scrollIntoView({ block:'nearest', behavior:'smooth' }); } catch (err) {} }
}
function openLoop(id){
  var lp = loopById(id);
  if (!lp) { return; }
  state.loop = id; state.step = -1; stopPlay();
  renderLoopList(); renderRing(lp, -1); renderDetail(lp);
  if (state.view === 'overview') { renderFlywheel(); }
}
function stopPlay(){
  state.playing = false;
  if (timer) { clearInterval(timer); timer = null; }
  var b = document.getElementById('playBtn');
  if (b) { b.textContent = '▶ 播放闭环'; b.classList.remove('on'); }
}
function startPlay(){
  var lp = loopById(state.loop);
  if (!lp) { return; }
  state.playing = true; state.step = 0;
  var b = document.getElementById('playBtn');
  b.textContent = '⏸ 暂停'; b.classList.add('on');
  renderRing(lp, 0); renderDetail(lp);
  timer = setInterval(function(){
    state.step = state.step + 1;
    if (state.step >= lp.steps.length) { state.step = 0; }
    renderRing(lp, state.step); renderDetail(lp);
  }, 1600);
}

/* ---------------- 功能全景 ---------------- */
function filterTree(nodes, q){
  var out = [];
  nodes.forEach(function(n){
    var kids = filterTree(n.children || [], q);
    if (!q || n.name.toLowerCase().indexOf(q) >= 0 || kids.length) { out.push({ name:n.name, children:kids }); }
  });
  return out;
}
function highlight(str, q){
  if (!q) { return esc(str); }
  var i = str.toLowerCase().indexOf(q);
  if (i < 0) { return esc(str); }
  return esc(str.slice(0, i)) + '<mark>' + esc(str.slice(i, i + q.length)) + '</mark>' + esc(str.slice(i + q.length));
}
function renderNodes(nodes, depth, host, expandAll){
  nodes.forEach(function(n){
    var wrap = document.createElement('div'); wrap.className = 'tnode';
    var row = document.createElement('div'); row.className = 'trow lv' + depth;
    var caret = document.createElement('span'); caret.className = 'tcaret';
    var lab = document.createElement('span'); lab.className = 'tlabel';
    lab.innerHTML = highlight(n.name, state.q);
    var hasKids = n.children && n.children.length > 0;
    caret.textContent = hasKids ? '▾' : '·';
    row.appendChild(caret); row.appendChild(lab); wrap.appendChild(row);
    var kids = document.createElement('div'); kids.className = 'tkids';
    if (hasKids) {
      renderNodes(n.children, depth + 1, kids, expandAll);
      var open = expandAll || depth < 1;
      if (!open) { kids.classList.add('hidden'); caret.textContent = '▸'; }
      row.onclick = function(){
        kids.classList.toggle('hidden');
        caret.textContent = kids.classList.contains('hidden') ? '▸' : '▾';
      };
    }
    wrap.appendChild(kids);
    host.appendChild(wrap);
  });
}
function renderTree(){
  var q = state.q.trim().toLowerCase();
  var data = q ? filterTree(DATA.tree, q) : DATA.tree;
  var host = document.getElementById('tree');
  host.innerHTML = '';
  renderNodes(data, 0, host, !!q);
  var total = 0; (function c(a){ a.forEach(function(n){ total++; c(n.children || []); }); })(data);
  document.getElementById('treeHint').textContent = q ? '匹配 ' + total + ' 个节点（已自动展开）' : '共 12 个业务域 · 点击标题行展开 / 收起';
}

/* ---------------- 页面索引 ---------------- */
function renderPages(){
  var q = state.q.trim().toLowerCase();
  var body = document.getElementById('pagesBody');
  var h = '', count = 0;
  DATA.pages.forEach(function(g){
    var rows = g.children.filter(function(r){
      return !q || (r.route + r.name + r.svc).toLowerCase().indexOf(q) >= 0;
    });
    if (!rows.length) { return; }
    h += '<tr><td class="pg-group" colspan="3">' + esc(g.name) + ' · ' + rows.length + '</td></tr>';
    rows.forEach(function(r){
      h += '<tr><td class="route">' + esc(r.route) + '</td><td>' + esc(r.name) + '</td><td class="svc">' + esc(r.svc) + '</td></tr>';
      count++;
    });
  });
  body.innerHTML = h || '<tr><td colspan="3" style="color:#8ea3cc;padding:20px">没有匹配的页面</td></tr>';
  document.getElementById('pagesHint').textContent = q ? '匹配 ' + count + ' 个页面' : '共 53 个页面（54 条路由配置）· 用右上角搜索过滤';
}

/* ---------------- 视图切换 ---------------- */
function showView(v){
  state.view = v;
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) { tabs[i].classList.toggle('active', tabs[i].getAttribute('data-view') === v); }
  var views = document.querySelectorAll('.view');
  for (var j = 0; j < views.length; j++) { views[j].classList.toggle('active', views[j].id === 'v-' + v); }
  if (v === 'overview') { renderFlywheel(); }
  if (v === 'loop') { var lp = loopById(state.loop); renderLoopList(); renderRing(lp, state.step); renderDetail(lp); }
}

/* ---------------- 事件 ---------------- */
document.getElementById('tabs').addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('.tab') : null;
  if (t) { stopPlay(); showView(t.getAttribute('data-view')); }
});
document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('[data-loop]') : null;
  if (t) { showView('loop'); openLoop(t.getAttribute('data-loop')); return; }
  var s = e.target.closest ? e.target.closest('[data-stage]') : null;
  if (s) {
    var id = s.getAttribute('data-stage');
    state.stageId = id; renderFlywheel();
    for (var i = 0; i < DATA.stageDefs.length; i++) { if (DATA.stageDefs[i].id === id) { renderOvSide(DATA.stageDefs[i]); } }
    return;
  }
  var st = e.target.closest ? e.target.closest('[data-step]') : null;
  if (st) {
    stopPlay();
    state.step = parseInt(st.getAttribute('data-step'), 10);
    var lp = loopById(state.loop);
    renderRing(lp, state.step); renderDetail(lp);
  }
});
document.getElementById('playBtn').addEventListener('click', function(){
  if (state.playing) { stopPlay(); var lp = loopById(state.loop); renderRing(lp, -1); renderDetail(lp); }
  else { startPlay(); }
});
document.getElementById('resetBtn').addEventListener('click', function(){
  stopPlay(); state.step = -1;
  var lp = loopById(state.loop); renderRing(lp, -1); renderDetail(lp);
});
document.getElementById('q').addEventListener('input', function(e){
  state.q = e.target.value;
  renderTree(); renderPages();
  var q = state.q.trim();
  document.getElementById('qcount').textContent = q ? '回车查看' : '';
});
document.getElementById('q').addEventListener('keydown', function(e){
  if (e.key === 'Enter' && state.q.trim()) { stopPlay(); showView('tree'); }
  if (e.key === 'Escape') { e.target.value = ''; state.q = ''; renderTree(); renderPages(); }
});

/* ---------------- 启动 ---------------- */
renderFlywheel();
renderOvSide(null);
renderLoopList();
var first = loopById(state.loop);
renderRing(first, -1);
renderDetail(first);
renderTree();
renderPages();
})();
</script>
