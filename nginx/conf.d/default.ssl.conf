# HTTPS 服务器块（自签证书，本地开发用）
# 端口 80 的 HTTP 服务由 default.conf 提供；此处仅启用 443。
# 生产环境请替换 /etc/nginx/ssl/ 下的证书为正式证书（如 Let's Encrypt）。

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    client_max_body_size 120M;   # 与业务上限对齐：视频最大 100MB（见 backend/src/config/upload.js）

    location /api/ {
        # 审计 I-08：Nginx 层限流 + 连接数限制
        limit_req zone=api_limit burst=40 nodelay;
        limit_conn conn_limit 50;
        proxy_pass http://eudazi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://eudazi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;

        # 防盗链默认关闭：本 server 的 server_name 是 `_`，valid_referers 里的
        # server_names 永远匹配不到真实 Referer，直接启用会把站内页面引用的图片一起 403。
        # 生产环境请替换成真实域名后再取消注释：
        #   valid_referers none blocked *.your-domain.com your-domain.com;
        #   if ($invalid_referer) { return 403; }

        try_files $uri =404;
    }

    location /admin {
        alias /usr/share/nginx/admin;
        index index.html;
        charset utf-8;
        # 审计 I-24：与 80 端口配置对齐，管理后台禁止缓存，避免升级后仍加载旧代码
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /health {
        proxy_pass http://eudazi_backend;
        access_log off;
    }
}
