upstream eudazi_backend {
    server backend:3000;
    keepalive 64;
}

# ===== HTTP 主配置（80 端口 + upstream 声明 + ACME 验证）=====
# HTTPS 由 default.ssl.conf 提供（自签或 certbot 正式证书，见 default.ssl.conf.disabled）。

server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME 验证（certbot webroot 模式，目录由 docker-compose 挂载）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    client_max_body_size 50M;

    # API 代理 - 保留后端原始 Content-Type，不做 charset 改写
    location /api/ {
        proxy_pass http://eudazi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket 代理（Socket.IO）
    location /socket.io/ {
        proxy_pass http://eudazi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 本地上传文件静态访问（防盗链）
    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;

        valid_referers none blocked server_names;
        if ($invalid_referer) {
            return 403;
        }

        try_files $uri =404;
    }

    # 管理后台 SPA（History 模式）
    location /admin {
        alias /usr/share/nginx/admin;
        index index.html;
        charset utf-8;
        # 禁止缓存，确保前端更新后浏览器立即加载最新代码
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /admin/index.html;
    }

    # 前端 SPA（Hash 模式）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;
        try_files $uri $uri/ /index.html;
    }

    # 健康检查
    location /health {
        proxy_pass http://eudazi_backend;
        access_log off;
    }
}
