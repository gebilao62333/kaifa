upstream eudazi_backend {
    server backend:3000;
    keepalive 64;
}

# ===== HTTP 主配置（80 端口 + upstream 声明 + ACME 验证）=====
# HTTPS 由同目录的 default.ssl.conf 提供（自签证书或 certbot 正式证书）；
# 生产环境请把 nginx/ssl/ 下的自签证书替换为真实证书。

server {
    listen 80;
    server_name _;

    # ===== HTTP → HTTPS =====
    # 除本机访问(localhost/127.0.0.1)、ACME 验证与 /health 探针外，一律 301 到 HTTPS，
    # 避免令牌/密码以明文传输（HSTS 只在 443 响应头下发，无法保护首次明文请求）。
    set $force_https 1;
    if ($host ~* ^(localhost|127\.0\.0\.1|\[::1\])(:\d+)?$) { set $force_https 0; }
    if ($request_uri ~ ^/\.well-known/acme-challenge/) { set $force_https 0; }
    if ($request_uri ~ ^/health) { set $force_https 0; }
    if ($force_https = 1) { return 301 https://$host$request_uri; }

    # Let's Encrypt ACME 验证（certbot webroot 模式，目录由 docker-compose 挂载）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    client_max_body_size 120M;   # 与业务上限对齐：视频最大 100MB（见 backend/src/config/upload.js）

    # API 代理 - 保留后端原始 Content-Type，不做 charset 改写
    location /api/ {
        # 审计 I-08：Nginx 层限流 + 连接数限制
        limit_req zone=api_limit burst=40 nodelay;
        limit_conn conn_limit 50;
        proxy_pass http://eudazi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket 代理（Socket.IO）
    location /socket.io/ {
        proxy_pass http://eudazi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 本地上传文件静态访问（防盗链）
    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;

        # 防盗链默认关闭：本 server 的 server_name 是 `_`，valid_referers 里的
        # server_names 永远匹配不到真实 Referer，直接启用会把站内页面引用的图片一起 403。
        # 生产环境请替换成真实域名后再取消注释：
        #   valid_referers none blocked *.your-domain.com your-domain.com;
        #   if ($invalid_referer) { return 403; }

        try_files $uri =404;
    }

    # 管理后台 SPA（History 模式）
    location /admin {
        alias /usr/share/nginx/admin;
        index index.html;
        charset utf-8;
        # 禁止缓存，确保前端更新后浏览器立即加载最新代码
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /admin/index.html;
    }

    # 前端 SPA（Hash 模式）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;
        try_files $uri $uri/ /index.html;
    }

    # 健康检查
    location /health {
        proxy_pass http://eudazi_backend;
        access_log off;
    }
}
