user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 120M;   # 与业务上限对齐：视频最大 100MB（见 backend/src/config/upload.js）

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 审计 I-08：在 Nginx 层做全局限流，避免绕过应用层限流直接打满后端
    # （应用层 apiLimiter 仍是最后一道，这里只拦最粗暴的突发流量）
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # 审计 I-07 / M-9：HTTP 层安全响应头基线（定义在 conf.d/security-headers.inc）。
    # nginx 的 add_header 不合并继承——子层一旦自声明就会丢弃这里的全部头，
    # 所以每个自带 add_header 的 location（/uploads/、/admin）都重新 include 同一片段。
    include /etc/nginx/conf.d/security-headers.inc;

    include /etc/nginx/conf.d/*.conf;
}
