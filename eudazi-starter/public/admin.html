<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多可 · 后台管理</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: #f4f6fb; color: #1f2937; }
    .topbar { background: #1f2937; color: #fff; padding: 14px 24px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    .topbar button { background: #ef4444; color: #fff; border: 0; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
    .wrap { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .panel { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); margin-bottom: 20px; }
    .panel h2 { font-size: 16px; margin-bottom: 14px; }
    .login input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #d1d5db; border-radius: 8px; }
    .login button { width: 100%; padding: 10px; background: #2563eb; color: #fff; border: 0; border-radius: 8px; cursor: pointer; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eef2f7; font-size: 14px; }
    .tag { padding: 2px 8px; border-radius: 999px; font-size: 12px; }
    .on { background: #dcfce7; color: #166534; }
    .off { background: #fee2e2; color: #991b1b; }
    .actions button { margin-right: 6px; padding: 4px 10px; border: 0; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .edit { background: #dbeafe; color: #1d4ed8; }
    .del { background: #fee2e2; color: #b91c1c; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 14px; }
    .toolbar button { padding: 8px 14px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; font-weight: 600; }
    .hidden { display: none; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; }
    .modal .box { background: #fff; border-radius: 12px; padding: 22px; width: min(420px, 92vw); }
    .modal input { width: 100%; padding: 9px; margin: 6px 0 14px; border: 1px solid #d1d5db; border-radius: 8px; }
    .modal .row { display: flex; gap: 10px; }
    .modal .row button { flex: 1; padding: 10px; border: 0; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .save { background: #2563eb; color: #fff; }
    .cancel { background: #e5e7eb; color: #374151; }
    #preview { margin-top: 12px; }
    #preview iframe { width: 100%; height: 240px; border: 1px solid #e5e7eb; border-radius: 8px; }
    .msg { font-size: 13px; color: #2563eb; min-height: 18px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="topbar"><span>多可 · 后台管理</span><button id="logout" class="hidden">退出登录</button></div>

  <div class="wrap">
    <!-- 登录 -->
    <div id="loginPanel" class="panel login">
      <h2>管理员登录</h2>
      <input id="username" placeholder="用户名" value="admin" />
      <input id="password" type="password" placeholder="密码" value="admin123" />
      <button id="loginBtn">登录</button>
      <div class="msg" id="loginMsg"></div>
    </div>

    <!-- 下载管理 -->
    <div id="adminPanel" class="panel hidden">
      <div class="toolbar">
        <button id="addBtn">+ 新增下载项</button>
        <button id="refreshBtn">刷新列表</button>
      </div>
      <table>
        <thead><tr><th>ID</th><th>平台</th><th>版本</th><th>下载地址</th><th>大小</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="preview"><h2 style="font-size:14px;margin-bottom:8px;">落地页实时预览</h2><iframe src="/"></iframe></div>
    </div>
  </div>

  <!-- 新增/编辑弹窗 -->
  <div id="modal" class="modal hidden">
    <div class="box">
      <h2 id="modalTitle">新增下载项</h2>
      <input type="hidden" id="editId" />
      <label>平台 (ios/android/harmony)</label><input id="f_platform" />
      <label>版本号</label><input id="f_version" />
      <label>下载地址</label><input id="f_url" />
      <label>安装包大小</label><input id="f_size" />
      <label>排序</label><input id="f_sort" />
      <label>状态 (1启用 / 0停用)</label><input id="f_status" />
      <div class="row">
        <button class="save" id="saveBtn">保存</button>
        <button class="cancel" id="cancelBtn">取消</button>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const token = localStorage.getItem('admin_token');
    const authHeaders = () => ({ 'Content-Type': 'application/json', 'x-admin-token': localStorage.getItem('admin_token') || '' });

    function show(ok) {
      $('loginPanel').classList.toggle('hidden', ok);
      $('adminPanel').classList.toggle('hidden', !ok);
      $('logout').classList.toggle('hidden', !ok);
    }
    if (token) show(true);

    async function api(url, opts = {}) {
      const res = await fetch(url, { ...opts, headers: authHeaders() });
      return res.json();
    }

    async function loadList() {
      const res = await api('/api/admin/downloads');
      const tbody = $('tbody');
      tbody.innerHTML = '';
      if (res.code !== 200) return;
      res.data.list.forEach(d => {
        const tr = document.createElement('tr');
        const statusTag = d.status === 1
          ? '<span class="tag on">启用</span>'
          : '<span class="tag off">停用</span>';
        tr.innerHTML = `<td>${d.id}</td><td>${d.platform}</td><td>${d.version}</td><td>${d.url || '-'}</td><td>${d.size || '-'}</td><td>${statusTag}</td>`;
        const td = document.createElement('td');
        td.className = 'actions';
        td.innerHTML = `<button class="edit">编辑</button><button class="del">删除</button>`;
        td.querySelector('.edit').onclick = () => openModal(d);
        td.querySelector('.del').onclick = async () => {
          if (!confirm('确认删除该下载项？')) return;
          await api('/api/admin/downloads/' + d.id, { method: 'DELETE' });
          loadList();
        };
        tr.appendChild(td);
        tbody.appendChild(tr);
      });
    }

    function openModal(d) {
      $('modalTitle').textContent = d ? '编辑下载项' : '新增下载项';
      $('editId').value = d ? d.id : '';
      $('f_platform').value = d ? d.platform : 'ios';
      $('f_version').value = d ? d.version : '1.0.0';
      $('f_url').value = d ? d.url : '';
      $('f_size').value = d ? d.size : '';
      $('f_sort').value = d ? d.sort : 99;
      $('f_status').value = d ? d.status : 1;
      $('modal').classList.remove('hidden');
    }

    $('loginBtn').onclick = async () => {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: $('username').value, password: $('password').value }),
      }).then(r => r.json());
      if (res.code === 200 && res.data.token) {
        localStorage.setItem('admin_token', res.data.token);
        show(true); loadList();
      } else {
        $('loginMsg').textContent = res.message || '登录失败';
      }
    };

    $('logout').onclick = () => { localStorage.removeItem('admin_token'); show(false); };
    $('refreshBtn').onclick = loadList;
    $('addBtn').onclick = () => openModal(null);
    $('cancelBtn').onclick = () => $('modal').classList.add('hidden');
    $('saveBtn').onclick = async () => {
      const id = $('editId').value;
      const body = {
        platform: $('f_platform').value,
        version: $('f_version').value,
        url: $('f_url').value,
        size: $('f_size').value,
        sort: Number($('f_sort').value),
        status: Number($('f_status').value),
      };
      if (id) await api('/api/admin/downloads/' + id, { method: 'PUT', body: JSON.stringify(body) });
      else await api('/api/admin/downloads', { method: 'POST', body: JSON.stringify(body) });
      $('modal').classList.add('hidden');
      loadList();
    };

    if (token) loadList();
  </script>
</body>
</html>
