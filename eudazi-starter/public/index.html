<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多可 · 下载中心</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); color: #fff;
    }
    .card {
      width: min(440px, 90vw); padding: 48px 36px; border-radius: 24px; text-align: center;
      background: rgba(255,255,255,0.12); backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.2);
    }
    .logo { font-size: 40px; font-weight: 800; letter-spacing: 2px; margin-bottom: 8px; }
    .subtitle { opacity: 0.9; margin-bottom: 28px; line-height: 1.6; font-size: 15px; }
    .btns { display: flex; flex-direction: column; gap: 14px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 15px; border-radius: 14px; font-size: 16px; font-weight: 600;
      text-decoration: none; color: #fff; background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.3); transition: transform .15s, background .15s;
    }
    .btn:hover { transform: translateY(-2px); background: rgba(255,255,255,0.3); }
    .btn .ic { font-size: 20px; }
    .tip { margin-top: 22px; font-size: 12px; opacity: 0.75; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">多可</div>
    <p class="subtitle">一款高品质的陪伴与社交平台，随时随地，畅享欢乐。<br/>请选择你的设备版本下载安装。</p>
    <div class="btns">
      <a class="btn" id="btn-ios" href="#"><span class="ic">🍎</span> 苹果下载</a>
      <a class="btn" id="btn-android" href="#"><span class="ic">🤖</span> 安卓下载</a>
      <a class="btn" id="btn-harmony" href="#"><span class="ic">🔷</span> 鸿蒙下载</a>
    </div>
    <p class="tip">下载地址由后台「下载管理」动态配置</p>
  </div>

  <script>
    // 同源调用公开下载 API，无需跨域
    const btnMap = { ios: 'btn-ios', android: 'btn-android', harmony: 'btn-harmony' };
    fetch('/api/download/platforms')
      .then(r => r.ok ? r.json() : null)
      .then(res => {
        if (!res || res.code !== 200 || !Array.isArray(res.data)) return;
        res.data.forEach(item => {
          const el = document.getElementById(btnMap[item.platform]);
          if (el && item.url) {
            el.href = item.url;
            if (item.version) el.title = item.name + ' ' + item.version;
          }
        });
      })
      .catch(() => {});
  </script>
</body>
</html>
