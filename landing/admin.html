<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>下载管理 · 后台</title>
  <style>
    :root {
      --bg-1: #4f46e5;
      --bg-2: #7c3aed;
      --bg-3: #db2777;
      --card: #ffffff;
      --muted: #6b7280;
      --line: #e5e7eb;
      --brand: #6366f1;
      --brand-d: #4338ca;
      --ok: #16a34a;
      --off: #9ca3af;
      --danger: #dc2626;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2) 55%, var(--bg-3));
      background-attachment: fixed;
      min-height: 100vh;
      color: #1f2937;
      padding: 28px 16px;
    }
    .wrap { max-width: 880px; margin: 0 auto; }
    .panel {
      background: var(--card);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,.18);
    }
    h1 { font-size: 22px; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }

    /* 登录 */
    #login-view { max-width: 360px; margin: 8vh auto; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .field input, .field select {
      width: 100%; padding: 12px 14px; border: 1px solid var(--line);
      border-radius: 12px; font-size: 14px; outline: none;
    }
    .field input:focus, .field select:focus { border-color: var(--brand); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 18px; border: none; border-radius: 12px; cursor: pointer;
      font-size: 14px; font-weight: 600; transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-primary:hover { background: var(--brand-d); }
    .btn-ghost { background: #f3f4f6; color: #374151; }
    .btn-ghost:hover { background: #e5e7eb; }
    .btn-danger { background: #fee2e2; color: var(--danger); }
    .btn-danger:hover { background: #fecaca; }
    .btn-sm { padding: 7px 12px; font-size: 13px; }
    .btn-block { width: 100%; padding: 13px; font-size: 15px; }

    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 11px 10px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; background: #f9fafb; }
    td .url { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #2563eb; }
    .tag { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .tag-ios { background: #e0f2fe; color: #0369a1; }
    .tag-android { background: #dcfce7; color: #15803d; }
    .tag-harmony { background: #fef3c7; color: #b45309; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .dot-on { background: var(--ok); }
    .dot-off { background: var(--off); }
    .ops { display: flex; gap: 6px; }

    .preview { margin-top: 26px; padding-top: 20px; border-top: 1px dashed var(--line); }
    .preview h3 { font-size: 15px; margin-bottom: 12px; }
    .pbtns { display: flex; gap: 12px; flex-wrap: wrap; }
    .pbtn {
      flex: 1; min-width: 140px; text-align: center; padding: 14px;
      border-radius: 14px; background: var(--brand); color: #fff; font-weight: 600;
      text-decoration: none; font-size: 14px; transition: transform .1s;
    }
    .pbtn:hover { transform: translateY(-2px); }
    .pbtn.disabled { background: #e5e7eb; color: #9ca3af; pointer-events: none; }

    /* 弹窗 */
    .mask {
      position: fixed; inset: 0; background: rgba(15,23,42,.5);
      display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
    }
    .mask.show { display: flex; }
    .modal { background: #fff; border-radius: 18px; padding: 24px; width: 100%; max-width: 420px; }
    .modal h2 { font-size: 18px; margin-bottom: 18px; }
    .row2 { display: flex; gap: 12px; }
    .row2 .field { flex: 1; }
    .modal-ops { display: flex; gap: 10px; margin-top: 8px; }
    .modal-ops .btn { flex: 1; }

    .empty { text-align: center; color: var(--muted); padding: 30px 0; font-size: 14px; }
    .toast {
      position: fixed; left: 50%; top: 24px; transform: translateX(-50%);
      background: #111827; color: #fff; padding: 10px 18px; border-radius: 10px;
      font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 99;
    }
    .toast.show { opacity: .95; }
    @media (max-width: 520px) {
      .panel { padding: 18px; }
      th:nth-child(4), td:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- 登录 -->
    <section id="login-view" class="panel">
      <h1>下载管理后台</h1>
      <p class="sub">请使用管理员账号登录</p>
      <div style="margin-top:18px">
        <div class="field">
          <label>用户名</label>
          <input id="username" value="admin" autocomplete="username" />
        </div>
        <div class="field">
          <label>密码</label>
          <input id="password" type="password" value="admin123" autocomplete="current-password" />
        </div>
        <button class="btn btn-primary btn-block" onclick="doLogin()">登 录</button>
        <p class="sub" style="margin-top:12px; text-align:center">默认账号 admin / admin123</p>
      </div>
    </section>

    <!-- 管理主界面 -->
    <section id="admin-view" class="panel" hidden>
      <div class="topbar">
        <div>
          <h1>下载管理</h1>
          <p class="sub">管理苹果 / 安卓 / 鸿蒙 三端下载地址</p>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="doLogout()">退出</button>
      </div>

      <div class="toolbar">
        <button class="btn btn-primary" onclick="openForm()">+ 新增下载</button>
        <button class="btn btn-ghost" onclick="loadAll()">刷新</button>
      </div>

      <div id="table-box">
        <table>
          <thead>
            <tr>
              <th>平台</th><th>版本</th><th>下载地址</th><th>大小</th><th>排序</th><th>状态</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div id="empty" class="empty" hidden>暂无下载项，点击「新增下载」添加。</div>
      </div>

      <div class="preview">
        <h3>落地页预览（公开接口 /api/download/platforms）</h3>
        <div class="pbtns" id="preview-btns"></div>
      </div>
    </section>
  </div>

  <!-- 新增/编辑弹窗 -->
  <div class="mask" id="mask">
    <div class="modal">
      <h2 id="form-title">新增下载</h2>
      <div class="field">
        <label>平台</label>
        <select id="f-platform">
          <option value="ios">苹果 (iOS)</option>
          <option value="android">安卓 (Android)</option>
          <option value="harmony">鸿蒙 (HarmonyOS)</option>
        </select>
      </div>
      <div class="row2">
        <div class="field">
          <label>版本号</label>
          <input id="f-version" placeholder="如 2.3.1" />
        </div>
        <div class="field">
          <label>大小</label>
          <input id="f-size" placeholder="如 48MB" />
        </div>
      </div>
      <div class="field">
        <label>下载地址 (URL)</label>
        <input id="f-url" placeholder="https://..." />
      </div>
      <div class="row2">
        <div class="field">
          <label>排序</label>
          <input id="f-sort" type="number" value="99" />
        </div>
        <div class="field">
          <label>状态</label>
          <select id="f-status">
            <option value="1">启用</option>
            <option value="0">停用</option>
          </select>
        </div>
      </div>
      <div class="modal-ops">
        <button class="btn btn-ghost" onclick="closeForm()">取消</button>
        <button class="btn btn-primary" onclick="saveForm()">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // 后端地址：本地预览指向 3000；生产若同域改为 ''
    const API_BASE = window.DOWNLOAD_API_BASE || 'http://localhost:3000'
    const TOKEN_KEY = 'admin_token'
    let editingId = null

    const $ = (id) => document.getElementById(id)
    const token = () => localStorage.getItem(TOKEN_KEY)

    function toast(msg) {
      const t = $('toast')
      t.textContent = msg
      t.classList.add('show')
      clearTimeout(t._t)
      t._t = setTimeout(() => t.classList.remove('show'), 2200)
    }

    async function api(method, path, body) {
      const res = await fetch(API_BASE + path, {
        method,
        headers: { Authorization: 'Bearer ' + token(), 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined
      })
      const data = await res.json().catch(() => ({}))
      if (res.status === 401) { doLogout(); throw new Error('登录失效') }
      return { ok: res.ok && data.code === 200, status: res.status, data }
    }

    async function doLogin() {
      const username = $('username').value.trim()
      const password = $('password').value
      try {
        const res = await fetch(API_BASE + '/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        })
        const data = await res.json()
        if (data.code === 200 && data.data && data.data.token) {
          localStorage.setItem(TOKEN_KEY, data.data.token)
          enterAdmin()
        } else {
          toast(data.message || '登录失败')
        }
      } catch (e) { toast('登录请求失败') }
    }

    function doLogout() {
      localStorage.removeItem(TOKEN_KEY)
      $('admin-view').hidden = true
      $('login-view').hidden = false
    }

    function enterAdmin() {
      $('login-view').hidden = true
      $('admin-view').hidden = false
      loadAll()
    }

    const PLAT = { ios: '苹果', android: '安卓', harmony: '鸿蒙' }
    const tagCls = { ios: 'tag-ios', android: 'tag-android', harmony: 'tag-harmony' }

    async function loadAll() {
      try {
        const [list, pub] = await Promise.all([
          api('GET', '/api/admin/downloads'),
          fetch(API_BASE + '/api/download/platforms').then(r => r.json())
        ])
        renderTable(list.data && list.data.data ? list.data.data.list : [])
        renderPreview(pub && pub.data ? pub.data : [])
      } catch (e) { /* 已处理 */ }
    }

    function renderTable(list) {
      const tb = $('tbody')
      tb.innerHTML = ''
      $('empty').hidden = list.length > 0
      list.forEach((d) => {
        const tr = document.createElement('tr')
        const on = Number(d.status) === 1
        tr.innerHTML = `
          <td><span class="tag ${tagCls[d.platform] || ''}">${PLAT[d.platform] || d.platform}</span></td>
          <td>${d.version || '-'}</td>
          <td><span class="url" title="${d.url || ''}">${d.url || '-'}</span></td>
          <td>${d.size || '-'}</td>
          <td>${d.sort != null ? d.sort : '-'}</td>
          <td><span class="dot ${on ? 'dot-on' : 'dot-off'}"></span>${on ? '启用' : '停用'}</td>
          <td>
            <div class="ops">
              <button class="btn btn-ghost btn-sm" onclick="openForm(${d.id})">编辑</button>
              <button class="btn btn-ghost btn-sm" onclick="toggleStatus(${d.id}, ${on ? 0 : 1})">${on ? '停用' : '启用'}</button>
              <button class="btn btn-danger btn-sm" onclick="removeItem(${d.id})">删除</button>
            </div>
          </td>`
        tb.appendChild(tr)
      })
    }

    function renderPreview(list) {
      const box = $('preview-btns')
      box.innerHTML = ''
      const have = {}
      list.forEach((d) => { have[d.platform] = d })
      ;['ios', 'android', 'harmony'].forEach((p) => {
        const item = have[p]
        const a = document.createElement('a')
        a.className = 'pbtn' + (item ? '' : ' disabled')
        a.textContent = PLAT[p] + '下载' + (item && item.version ? ' ' + item.version : '')
        if (item) { a.href = item.url; a.target = '_blank'; a.title = item.url }
        else { a.href = 'javascript:void(0)'; a.title = '未配置' }
        box.appendChild(a)
      })
    }

    function openForm(id) {
      editingId = id || null
      $('form-title').textContent = id ? '编辑下载' : '新增下载'
      if (id) {
        api('GET', '/api/admin/downloads/' + id).then((r) => {
          const d = r.data.data
          $('f-platform').value = d.platform
          $('f-version').value = d.version || ''
          $('f-size').value = d.size || ''
          $('f-url').value = d.url || ''
          $('f-sort').value = d.sort != null ? d.sort : 99
          $('f-status').value = String(d.status)
        }).catch(() => {})
      } else {
        $('f-platform').value = 'ios'
        $('f-version').value = ''
        $('f-size').value = ''
        $('f-url').value = ''
        $('f-sort').value = 99
        $('f-status').value = '1'
      }
      $('mask').classList.add('show')
    }

    function closeForm() { $('mask').classList.remove('show'); editingId = null }

    async function saveForm() {
      const body = {
        platform: $('f-platform').value,
        version: $('f-version').value.trim(),
        size: $('f-size').value.trim(),
        url: $('f-url').value.trim(),
        sort: Number($('f-sort').value || 99),
        status: Number($('f-status').value)
      }
      if (!body.url) { toast('请填写下载地址'); return }
      try {
        const r = editingId
          ? await api('PUT', '/api/admin/downloads/' + editingId, body)
          : await api('POST', '/api/admin/downloads', body)
        if (r.ok) { toast('保存成功'); closeForm(); loadAll() }
        else toast(r.data.message || '保存失败')
      } catch (e) { toast('保存失败') }
    }

    async function toggleStatus(id, status) {
      try {
        const r = await api('PATCH', '/api/admin/downloads/' + id + '/status', { status })
        if (r.ok) { toast('已' + (status ? '启用' : '停用')); loadAll() }
        else toast(r.data.message || '操作失败')
      } catch (e) { /* */ }
    }

    async function removeItem(id) {
      if (!confirm('确定删除该下载项？')) return
      try {
        const r = await api('DELETE', '/api/admin/downloads/' + id)
        if (r.ok) { toast('已删除'); loadAll() }
        else toast(r.data.message || '删除失败')
      } catch (e) { /* */ }
    }

    // 回车登录
    $('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin() })
    $('mask').addEventListener('click', (e) => { if (e.target === $('mask')) closeForm() })

    // 已登录则直接进入
    if (token()) enterAdmin()
  </script>
</body>
</html>
