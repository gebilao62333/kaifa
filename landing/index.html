<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多可 · 让社交更有温度</title>
  <meta name="description" content="多可 App 官方下载页 —— 苹果、安卓、鸿蒙全平台支持。" />
  <style>
    :root {
      --bg-1: #6366f1;
      --bg-2: #8b5cf6;
      --bg-3: #ec4899;
      --card: rgba(255, 255, 255, 0.12);
      --card-border: rgba(255, 255, 255, 0.22);
      --text: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.78);
      --btn: rgba(255, 255, 255, 0.95);
      --btn-text: #4338ca;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2) 50%, var(--bg-3));
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* 柔光球背景 */
    body::before,
    body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.55;
      pointer-events: none;
    }
    body::before { width: 360px; height: 360px; background: #22d3ee; top: -120px; left: -100px; }
    body::after  { width: 420px; height: 420px; background: #f472b6; bottom: -160px; right: -120px; }

    .hero {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 48px 36px 40px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
    }

    .logo {
      width: 84px;
      height: 84px;
      margin: 0 auto 22px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid var(--card-border);
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 16px;
      color: var(--text-dim);
      line-height: 1.6;
      margin-bottom: 6px;
    }

    .desc {
      font-size: 14px;
      color: var(--text-dim);
      line-height: 1.7;
      margin: 18px auto 30px;
      max-width: 420px;
    }

    .downloads {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 20px;
      border: none;
      border-radius: 16px;
      background: var(--btn);
      color: var(--btn-text);
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(0, 0, 0, 0.18); }
    .btn:active { transform: translateY(0); opacity: 0.92; }
    .btn svg { width: 24px; height: 24px; flex: none; }

    .note {
      margin-top: 26px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.6;
    }

    .footer {
      position: relative;
      z-index: 1;
      margin-top: 22px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      text-align: center;
    }

    @media (min-width: 480px) {
      h1 { font-size: 36px; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="logo">多</div>
    <h1>多可 App</h1>
    <p class="tagline">让社交更有温度，认识同频的人</p>

    <p class="desc">
      多可是一款专注真实连接的社交应用。在这里你可以发现附近有趣的人，
      加入兴趣小组，分享生活瞬间。全平台支持，随时随地与你同频。
    </p>

    <div class="downloads">
      <!-- 请将 href 替换为真实下载/落地页地址 -->
      <a class="btn" id="btn-ios" href="#" aria-label="苹果下载">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M16.365 1.43c0 1.14-.42 2.2-1.12 2.99-.78.88-2.06 1.56-3.12 1.47-.13-1.12.43-2.3 1.1-3.04.77-.85 2.13-1.49 3.14-1.42zM20.5 17.2c-.55 1.27-.82 1.84-1.53 2.97-1.02 1.62-2.46 3.64-4.24 3.65-1.64.01-2.03-1.07-4.21-1.06-2.18.01-2.64 1.09-4.27 1.08-1.78-.02-3.14-1.83-4.16-3.45C-.05 16.7-.28 11.2 1.68 8.36c1.16-1.69 3.01-2.73 4.78-2.73 1.78 0 2.9 1.07 4.38 1.07 1.46 0 2.35-1.07 4.45-1.07 1.6 0 3.3.87 4.51 2.38-3.96 2.17-3.32 7.83.7 9.19z"/>
        </svg>
        苹果下载
      </a>

      <a class="btn" id="btn-android" href="#" aria-label="安卓下载">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M6 9.5c0 .3-.2.5-.5.5S5 9.8 5 9.5s.2-.5.5-.5.5.2.5.5zm12 0c0 .3-.2.5-.5.5s-.5-.2-.5-.5.2-.5.5-.5.5.2.5.5zM17 4l-1.1 1.2c-.2.2-.1.5.1.7.5.4.8 1 .8 1.6 0 1.1-.9 2-2 2s-2-.9-2-2c0-.6.3-1.2.8-1.6.2-.2.3-.5.1-.7L12.4 4c-.2-.2-.5-.2-.7 0L10.7 5c-.2.2-.1.5.1.7.5.4.8 1 .8 1.6 0 1.1-.9 2-2 2s-2-.9-2-2c0-.6.3-1.2.8-1.6.2-.2.3-.5.1-.7L8.8 4c-.2-.2-.5-.2-.7 0L5 7.8c-.2.2-.1.5.1.7.5.4.8 1 .8 1.6 0 1.1-.9 2-2 2s-2-.9-2-2c0-.6.3-1.2.8-1.6.2-.2.3-.5.1-.7L.4 8.6c-.2-.2-.5-.2-.7 0L0 9.3v10.2L4.2 23l3.9-1 3.9 1 4.2-1 4.2 1L24 19.5V9.3l-.4-.7c-.2-.2-.5-.2-.7 0L20.4 9c-.2.2-.1.5.1.7.5.4.8 1 .8 1.6 0 1.1-.9 2-2 2s-2-.9-2-2c0-.6.3-1.2.8-1.6.2-.2.3-.5.1-.7L17 4zM4 19.5l2.6-1 .4 3.2L4 19.5zm8 1.2l-3.9-1-1-2.8 4.9 2.8zm0-3.8L7.1 14l1-2.7 3.9 2.3zm4 .8l-3.9 1-3.9-1 1-3.2 2.9 1.7zm3 1.2l-3-2.6.4-3.2 2.6 1z"/>
        </svg>
        安卓下载
      </a>

      <a class="btn" id="btn-harmony" href="#" aria-label="鸿蒙下载">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2c1.7 0 3 1.3 3 3 0 .3-.1.6-.2.9 1.9.7 3.2 2.5 3.2 4.6 0 1.5-.7 2.8-1.8 3.7.4.6.6 1.3.6 2.1 0 1.7-1.1 3.2-2.7 3.7.1.2.1.4.1.6 0 1.1-.9 2-2 2s-2-.9-2-2c0-.2 0-.4.1-.6-1.6-.5-2.7-2-2.7-3.7 0-.8.2-1.5.6-2.1-1.1-.9-1.8-2.2-1.8-3.7 0-2.1 1.3-3.9 3.2-4.6-.1-.3-.2-.6-.2-.9 0-1.7 1.3-3 3-3zm0 2c-.6 0-1 .4-1 1s.4 1 1 1 1-.4 1-1-.4-1-1-1zm-2.6 5.4c-.9.3-1.4 1.2-1.1 2.1.2.7.9 1.1 1.6 1.1.9 0 1.6-.7 1.6-1.5 0-.6-.3-1.1-.8-1.4-.1-.2-.2-.3-.3-.3zm5.2 0c-.1 0-.2.1-.3.3-.5.3-.8.8-.8 1.4 0 .8.7 1.5 1.6 1.5.7 0 1.4-.4 1.6-1.1.3-.9-.2-1.8-1.1-2.1z"/>
        </svg>
        鸿蒙下载
      </a>
    </div>

    <p class="note">
      下载遇到问题？请确认设备已开启「允许安装未知来源应用」。<br />
      © 2026 多可 App · 保留所有权利
    </p>
  </main>

  <footer class="footer">多可 · 让社交更有温度</footer>

  <script>
    // 下载接口地址：
    // - 生产环境若与后端同域，改为 ''（走相对路径 /api/download/platforms）即可；
    // - 本地预览分离部署时指向后端地址（如 http://localhost:3000）。
    window.DOWNLOAD_API_BASE = window.DOWNLOAD_API_BASE || 'http://localhost:3000'
    const API_BASE = window.DOWNLOAD_API_BASE || ''
    const btnMap = { ios: 'btn-ios', android: 'btn-android', harmony: 'btn-harmony' }
    fetch(API_BASE + '/api/download/platforms')
      .then(function (r) { return r.ok ? r.json() : null })
      .then(function (res) {
        if (!res || res.code !== 200 || !Array.isArray(res.data)) return
        res.data.forEach(function (item) {
          var el = document.getElementById(btnMap[item.platform])
          if (el && item.url) {
            el.href = item.url
            if (item.version) el.title = item.name + ' ' + item.version
          }
        })
      })
      .catch(function () {})
  </script>
</body>
</html>
