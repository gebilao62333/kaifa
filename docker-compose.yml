# ============================================
# eu搭子 Docker Compose 配置
# 启动: docker-compose up -d
# 停止: docker-compose down
# 查看日志: docker-compose logs -f backend
# ============================================

services:
  # ============================================
  # Nginx - 反向代理 + 静态文件服务
  # ============================================
  nginx:
    image: nginx:1.26-alpine
    container_name: eudazi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/logs:/var/log/nginx
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./admin-frontend/dist:/usr/share/nginx/admin:ro
      - ./backend/public/uploads:/usr/share/nginx/uploads:ro
    depends_on:
      - backend
    networks:
      - eudazi_net
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Backend - Node.js API 服务
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eudazi-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 生产模式（通过 LOG_TO_CONSOLE=true 确保 docker logs 可见）
      - NODE_ENV=production
      - LOG_TO_CONSOLE=true
      - LOGS_PATH=/var/log/eudazi
      # 数据库连接使用 Docker 内部服务名
      - DB_HOST=mysql
      - DB_PORT=3306
      - MONGO_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD 必须在 .env 中设置}@mongo:27017/${MONGO_DATABASE:-eudazi}?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # 连接凭据兜底：与下方 mysql/mongo/redis 服务默认值对齐；
      # 当根 .env 缺失对应键时，使用与对应数据库服务一致的默认值，避免连不上。
      - DB_NAME=${MYSQL_DATABASE:-eudazi}
      - DB_USER=${MYSQL_USER:-eudazi}
      - DB_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD 必须在 .env 中设置}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD 必须在 .env 中设置}
    volumes:
      # 日志持久化
      - eudazi_logs:/var/log/eudazi
      # 上传文件持久化
      - ./backend/public/uploads:/app/public/uploads
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eudazi_net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    # 安全加固：禁止提权、只读根文件系统（日志/上传目录通过 volume 挂载写入）
    security_opt:
      - no-new-privileges:true
    read_only: false

  # ============================================
  # MySQL 8.0 - 主数据库
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: eudazi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 必须在 .env 中设置}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-eudazi}
      MYSQL_USER: ${MYSQL_USER:-eudazi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 必须在 .env 中设置}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=100
      - --innodb_buffer_pool_size=128M
      - --innodb_log_buffer_size=32M
      - --innodb_flush_log_at_trx_commit=2
      - --performance_schema=OFF
    volumes:
      - eudazi_mysql_data:/var/lib/mysql
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:3307:3306"
    networks:
      - eudazi_net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # MongoDB 6.0 - 文档数据库（聊天/动态等）
  # ============================================
  mongo:
    image: mongo:6.0
    container_name: eudazi-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD 必须在 .env 中设置}
      MONGO_APP_USER: ${MONGO_APP_USER:-eudazi}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD 必须在 .env 中设置}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-eudazi}
      TZ: Asia/Shanghai
    command:
      - --wiredTigerCacheSizeGB=0.25
    volumes:
      - eudazi_mongo_data:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - eudazi_net
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Redis 7 - 缓存 / Session / 消息队列
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: eudazi-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly yes
      - --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD 必须在 .env 中设置}
      - --maxmemory 128mb
      - --maxmemory-policy allkeys-lru
      - --save 900 1
      - --save 300 10
    volumes:
      - eudazi_redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - eudazi_net
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 96M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Certbot - Let's Encrypt 证书签发与自动续期
  # 默认不启动（profiles: certbot）。前置条件：域名 DNS A 记录已指向本服务器公网 IP，且 80/443 已开放。
  # 首次签发:
  #   docker compose --profile certbot run --rm --entrypoint certbot certbot certonly \
  #     --webroot -w /var/www/certbot -d 你的域名 --email 你的邮箱 --agree-tos --non-interactive
  # 自动续期（每 12h 检查，到期前 30 天自动续）:
  #   docker compose --profile certbot up -d certbot
  # 详细步骤见 .workbuddy/生产证书部署指南.md
  # ============================================
  certbot:
    image: certbot/certbot:latest
    container_name: eudazi-certbot
    profiles: ["certbot"]
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $$!; done;'"

  # TURN 中继：自建 WebRTC 在对称 NAT / 严格防火墙下无法打洞时必须依赖它（约 10-20% 用户）。
  # 启用：docker compose --profile turn up -d；需放行 3478/udp+tcp 与 49160-49200/udp，
  # 并把服务器公网 IP 填入 TURN_EXTERNAL_IP（否则中继地址不可达）。
  # 鉴权采用 REST API 模式（--use-auth-secret）：凭据由后端按用户临时签发
  # （见 backend/src/services/callConfigService.js），前端不持有长期共享密钥，
  # 因此 TURN_SECRET 必须与 backend/.env 中的 TURN_SECRET 完全一致。
  coturn:
    image: coturn/coturn:latest
    container_name: eudazi-coturn
    restart: unless-stopped
    network_mode: host
    profiles: ["turn"]
    command: >
      -n --log-file=stdout --fingerprint --lt-cred-mech
      --realm=${TURN_REALM:-eudazi}
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET:-change-me-in-env}
      --external-ip=${TURN_EXTERNAL_IP:-}
      --min-port=49160 --max-port=49200
      --no-cli --no-tls --no-dtls

# ============================================
# 数据卷
# ============================================
volumes:
  eudazi_mysql_data:
    driver: local
  eudazi_mongo_data:
    driver: local
  eudazi_redis_data:
    driver: local
  eudazi_logs:
    driver: local

# ============================================
# 网络
# ============================================
networks:
  eudazi_net:
    driver: bridge
